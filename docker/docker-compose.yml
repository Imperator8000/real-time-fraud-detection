name: fraud-detection-platform


# ============================================================
# REUSABLE SPARK SERVICE TEMPLATE
# ============================================================

x-spark-service: &spark-service

  build:
    context: ..
    dockerfile: docker/spark/Dockerfile

  image: fraud-detection-spark:3.5.9

  working_dir: /workspace

  env_file:
    - ../.env

  volumes:
    # Project source code, Delta tables, checkpoints and logs
    - ../:/workspace

    # Shared Maven/Ivy dependency cache
    - spark-ivy-cache:/root/.ivy2

  restart: unless-stopped


# ============================================================
# COMMON PIPELINE ENVIRONMENT
# ============================================================

x-pipeline-environment: &pipeline-environment

  # ----------------------------------------------------------
  # SPARK EXECUTION
  # ----------------------------------------------------------

  SPARK_MASTER: "local[2]"

  SPARK_SQL_SHUFFLE_PARTITIONS: "${SPARK_SQL_SHUFFLE_PARTITIONS:-8}"

  SPARK_DEFAULT_PARALLELISM: "${SPARK_DEFAULT_PARALLELISM:-8}"

  SPARK_LOG_LEVEL: "${SPARK_LOG_LEVEL:-WARN}"

  PYSPARK_PYTHON: "python3"

  PYSPARK_DRIVER_PYTHON: "python3"

  PYTHONPATH: "/workspace"

  # ----------------------------------------------------------
  # KAFKA
  # ----------------------------------------------------------

  KAFKA_INTERNAL_BOOTSTRAP_SERVERS: "broker:19092"

  KAFKA_TRANSACTION_TOPIC: "${KAFKA_TRANSACTION_TOPIC:-transactions}"

  # ----------------------------------------------------------
  # SPARK EVENT LOGGING
  # ----------------------------------------------------------

  SPARK_EVENT_LOG_ENABLED: "true"

  SPARK_EVENT_LOG_DIR: "file:///workspace/logs/spark-events"

  SPARK_STREAMING_METRICS_ENABLED: "true"

  STREAMING_METRICS_DIR: "data/monitoring/streaming_progress"


services:


  # ==========================================================
  # APACHE KAFKA
  # ==========================================================

  broker:

    image: apache/kafka:4.3.1

    hostname: broker

    container_name: fraud-kafka

    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1 || exit 1"
        ]

      interval: 10s

      timeout: 5s

      retries: 12

      start_period: 20s


  # ==========================================================
  # KAFKA TOPIC INITIALIZER
  # ==========================================================

  kafka-init:

    image: apache/kafka:4.3.1

    container_name: fraud-kafka-init

    depends_on:

      broker:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command: >
      echo "Creating Kafka topics..." &&
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server broker:19092
      --create
      --if-not-exists
      --topic transactions
      --partitions 6
      --replication-factor 1
      &&
      echo "Transaction topic ready." &&
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server broker:19092
      --describe
      --topic transactions


  # ==========================================================
  # SPARK HISTORY SERVER
  # ==========================================================

  spark-history:

    <<: *spark-service

    container_name: fraud-spark-history

    hostname: spark-history

    restart: unless-stopped

    environment:

      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:///workspace/logs/spark-events
        -Dspark.history.ui.port=18080
        -Dspark.history.fs.update.interval=5s
        -Dspark.history.retainedApplications=50
        -Dspark.history.fs.cleaner.enabled=true
        -Dspark.history.fs.cleaner.interval=1d
        -Dspark.history.fs.cleaner.maxAge=7d

    ports:
      - "18080:18080"

    command:
      - spark-class
      - org.apache.spark.deploy.history.HistoryServer

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:18080 >/dev/null || exit 1"
        ]

      interval: 15s

      timeout: 5s

      retries: 10

      start_period: 20s


  # ==========================================================
  # 1. KAFKA → BRONZE
  # ==========================================================

  bronze-stream:

    <<: *spark-service

    container_name: fraud-bronze-stream

    hostname: bronze-stream

    environment:
      <<: *pipeline-environment

    depends_on:

      broker:
        condition: service_healthy

    command:
      - python
      - -m
      - src.streaming.bronze_kafka_stream

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pgrep -f 'src.streaming.bronze_kafka_stream' >/dev/null || exit 1"
        ]

      interval: 30s

      timeout: 5s

      retries: 3

      start_period: 30s


  # ==========================================================
  # 2. BRONZE → SILVER / QUARANTINE
  # ==========================================================

  silver-stream:

    <<: *spark-service

    container_name: fraud-silver-stream

    hostname: silver-stream

    environment:
      <<: *pipeline-environment

    depends_on:

      broker:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - >
        python scripts/wait_for_dependencies.py
        --path data/bronze/transactions/_delta_log
        &&
        exec python -m src.streaming.silver_transaction_stream

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pgrep -f 'src.streaming.silver_transaction_stream' >/dev/null || pgrep -f 'wait_for_dependencies.py' >/dev/null || exit 1"
        ]

      interval: 30s

      timeout: 5s

      retries: 3

      start_period: 30s


  # ==========================================================
  # 3. SILVER → 10-MINUTE WINDOW FEATURES
  # ==========================================================

  window-stream:

    <<: *spark-service

    container_name: fraud-window-stream

    hostname: window-stream

    environment:
      <<: *pipeline-environment

    depends_on:

      broker:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - >
        python scripts/wait_for_dependencies.py
        --path data/silver/transactions/_delta_log
        &&
        exec python -m src.streaming.window_feature_stream

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pgrep -f 'src.streaming.window_feature_stream' >/dev/null || pgrep -f 'wait_for_dependencies.py' >/dev/null || exit 1"
        ]

      interval: 30s

      timeout: 5s

      retries: 3

      start_period: 30s


  # ==========================================================
  # 4. SILVER → STATEFUL USER BEHAVIOR
  # ==========================================================

  stateful-stream:

    <<: *spark-service

    container_name: fraud-stateful-stream

    hostname: stateful-stream

    environment:
      <<: *pipeline-environment

    depends_on:

      broker:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - >
        python scripts/wait_for_dependencies.py
        --path data/silver/transactions/_delta_log
        &&
        exec python -m src.streaming.stateful_anomaly_stream

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pgrep -f 'src.streaming.stateful_anomaly_stream' >/dev/null || pgrep -f 'wait_for_dependencies.py' >/dev/null || exit 1"
        ]

      interval: 30s

      timeout: 5s

      retries: 3

      start_period: 30s


  # ==========================================================
  # 5. STATEFUL + WINDOW → IMMUTABLE FEATURE EVENTS
  # ==========================================================

  live-feature-stream:

    <<: *spark-service

    container_name: fraud-live-feature-stream

    hostname: live-feature-stream

    environment:
      <<: *pipeline-environment

    depends_on:

      broker:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - >
        python scripts/wait_for_dependencies.py
        --path data/silver/stateful_transaction_features/_delta_log
        --path data/silver/user_window_features/_delta_log
        &&
        exec python -m src.streaming.live_feature_event_stream

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pgrep -f 'src.streaming.live_feature_event_stream' >/dev/null || pgrep -f 'wait_for_dependencies.py' >/dev/null || exit 1"
        ]

      interval: 30s

      timeout: 5s

      retries: 3

      start_period: 30s


  # ==========================================================
  # 6. RANDOM FOREST + FINAL FRAUD DECISION
  # ==========================================================

  final-scoring-stream:

    <<: *spark-service

    container_name: fraud-final-scoring-stream

    hostname: final-scoring-stream

    environment:
      <<: *pipeline-environment

    depends_on:

      broker:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - >
        python scripts/wait_for_dependencies.py
        --path data/gold/fraud_feature_events/_delta_log
        --path models/fraud_random_forest/metadata
        &&
        exec python -m src.streaming.final_fraud_scoring_stream

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pgrep -f 'src.streaming.final_fraud_scoring_stream' >/dev/null || pgrep -f 'wait_for_dependencies.py' >/dev/null || exit 1"
        ]

      interval: 30s

      timeout: 5s

      retries: 3

      start_period: 30s


  # ==========================================================
  # FRAUD MONITORING DASHBOARD
  # ==========================================================

  dashboard:

    build:
      context: ..
      dockerfile: docker/dashboard/Dockerfile

    image: fraud-detection-dashboard:1.0

    container_name: fraud-dashboard

    hostname: fraud-dashboard

    restart: unless-stopped

    working_dir: /workspace

    env_file:
      - ../.env

    volumes:
      - ../:/workspace

    ports:
      - "8501:8501"

    depends_on:

      final-scoring-stream:
        condition: service_started

    command:
      - streamlit
      - run
      - src/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3).read()\""
        ]

      interval: 15s

      timeout: 5s

      retries: 5

      start_period: 20s


  # ==========================================================
  # OPTIONAL DEVELOPMENT CONTAINER
  # ==========================================================

  spark-dev:

    <<: *spark-service

    profiles:
      - dev

    container_name: fraud-spark-dev

    hostname: spark-dev

    environment:
      <<: *pipeline-environment

    depends_on:

      broker:
        condition: service_healthy

    ports:
      - "4040:4040"

    command:
      - sleep
      - infinity


  # ==========================================================
  # OPTIONAL DEMO TRANSACTION PRODUCER
  # ==========================================================

  transaction-producer:

    <<: *spark-service

    profiles:
      - demo

    container_name: fraud-transaction-producer

    hostname: transaction-producer

    environment:

      KAFKA_BOOTSTRAP_SERVERS: "broker:19092"

      KAFKA_TRANSACTION_TOPIC: "transactions"

      PYTHONPATH: "/workspace"

    depends_on:

      broker:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - >
        python -m src.producer.kafka_transaction_producer
        --rate ${DEMO_TRANSACTION_RATE:-50}
        --users ${DEMO_USER_COUNT:-2000}
        --fraud-rate ${DEMO_FRAUD_RATE:-0.02}


# ============================================================
# VOLUMES
# ============================================================

volumes:

  spark-ivy-cache:

    name: fraud-spark-ivy-cache